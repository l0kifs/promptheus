version: '3.8'

services:
  promptheus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # API server port
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://promptheus:password@postgres:5432/promptheus
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8080
      - BOT_MODE=polling
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=promptheus
      - POSTGRES_USER=promptheus
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptheus -d promptheus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: